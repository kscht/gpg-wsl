name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck -x --severity=warning scripts/install.sh scripts/uninstall.sh scripts/status.sh scripts/lib.sh

  install-cycle:
    runs-on: ubuntu-latest
    env:
      PRIMARY:   alice
      SECONDARY: bob
    steps:
      - uses: actions/checkout@v4

      - name: Create test users
        run: |
          sudo useradd -m -s /bin/bash "$PRIMARY"
          sudo useradd -m -s /bin/bash "$SECONDARY"

      - name: First install
        run: sudo make install PRIMARY_USER="$PRIMARY" SECONDARY_USER="$SECONDARY"

      - name: Verify installed artifacts
        run: |
          sudo test -f /etc/polkit-1/rules.d/45-pcscd-scard.rules
          sudo test -f /etc/sudoers.d/96-yubikey-proxy
          test  -x /usr/local/bin/scdaemon-proxy.sh
          sudo test -f /home/$PRIMARY/.gnupg/scdaemon.conf
          sudo test -f /home/$SECONDARY/.gnupg/gpg-agent.conf
          sudo grep -q 'BEGIN gpg-wsl' /home/$PRIMARY/.bashrc
          sudo grep -q 'BEGIN gpg-wsl' /home/$SECONDARY/.bashrc
          sudo grep -q 'multi-server' /home/$PRIMARY/.gnupg/scdaemon.conf
          sudo grep -q 'scdaemon-program' /home/$SECONDARY/.gnupg/gpg-agent.conf
          sudo visudo -cf /etc/sudoers.d/96-yubikey-proxy
          id "$PRIMARY"   | grep -q 'scard'
          id "$SECONDARY" | grep -q 'scard'

      - name: Idempotent install (run again)
        run: sudo make install PRIMARY_USER="$PRIMARY" SECONDARY_USER="$SECONDARY"

      - name: Single-instance bashrc snippet (no duplication)
        run: |
          for u in "$PRIMARY" "$SECONDARY"; do
            count=$(sudo grep -c 'BEGIN gpg-wsl' /home/$u/.bashrc)
            if [ "$count" -ne 1 ]; then
              echo "duplicate snippet in /home/$u/.bashrc (found $count)"; exit 1
            fi
          done

      - name: Status command runs
        run: make status PRIMARY_USER="$PRIMARY" SECONDARY_USER="$SECONDARY" || true

      - name: Uninstall
        run: sudo make uninstall PRIMARY_USER="$PRIMARY" SECONDARY_USER="$SECONDARY"

      - name: Verify clean state
        run: |
          sudo test ! -f /etc/polkit-1/rules.d/45-pcscd-scard.rules
          sudo test ! -f /etc/sudoers.d/96-yubikey-proxy
          test ! -f /usr/local/bin/scdaemon-proxy.sh
          sudo test ! -f /home/$PRIMARY/.gnupg/scdaemon.conf
          ! sudo grep -q 'BEGIN gpg-wsl' /home/$PRIMARY/.bashrc
          ! sudo grep -q 'BEGIN gpg-wsl' /home/$SECONDARY/.bashrc
          ! sudo grep -q 'scdaemon-program /usr/local/bin/scdaemon-proxy.sh' \
            /home/$SECONDARY/.gnupg/gpg-agent.conf 2>/dev/null

  end-to-end-with-vsmartcard:
    runs-on: ubuntu-latest
    continue-on-error: true  # vpcd/vicc setup is fragile in CI; track but do not block
    env:
      PRIMARY:   alice
      SECONDARY: bob
    steps:
      - uses: actions/checkout@v4

      - name: Create test users
        run: |
          sudo useradd -m -s /bin/bash "$PRIMARY"
          sudo useradd -m -s /bin/bash "$SECONDARY"

      - name: Install vsmartcard (virtual reader + ICC + OpenPGP applet)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vsmartcard-vpcd vsmartcard-vpicc pcsc-tools

      - name: Run gpg-wsl install
        run: sudo make install PRIMARY_USER="$PRIMARY" SECONDARY_USER="$SECONDARY"

      - name: Restart pcscd to load vpcd driver, start virtual OpenPGP card
        run: |
          sudo systemctl restart pcscd
          sleep 2
          nohup vicc --type openpgp >/tmp/vicc.log 2>&1 &
          sleep 5
          echo "--- pcsc_scan ---"
          timeout 3 pcsc_scan -n || true
          echo "--- vicc log ---"
          tail -30 /tmp/vicc.log || true
          echo "--- pcscd journal ---"
          sudo journalctl -u pcscd --no-pager -n 20 || true

      - name: Card visible under PRIMARY
        run: |
          sudo -u "$PRIMARY" -i gpg --card-status 2>&1 | tee /tmp/primary-card.log
          grep -q "Application type" /tmp/primary-card.log

      - name: Card visible under SECONDARY (via proxy)
        run: |
          sudo -u "$SECONDARY" -i gpg --card-status 2>&1 | tee /tmp/secondary-card.log
          grep -q "Application type" /tmp/secondary-card.log
